# Configuration for cargo-audit
[advisories]
# List of ignored security advisories (RUSTSEC-ID)
ignore = [
    "RUSTSEC-2021-0127" # serde_cbor is unmaintained, but no critical vulnerability found
]

[informational_warnings]
# Keep maintenance warnings visible in logs for awareness,
# but they won't trigger a workflow failure (keeps the badge green).
deny = ["unsound"]
