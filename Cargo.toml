[package]
name = "aiplan4rust"
version = "0.1.0"
authors = ["Damien Pellier <damien.pellier@imag.fr>"]
edition = "2021"

[dependencies]
logos = "0.15"
lalrpop-util = "0.22.2"
ordered-float = "5.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.140"
clap = { version = "4.5.40", features = ["derive"] }
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
colored = "3.0.0"
itertools = "0.14.0"
log = "0.4.27"
env_logger = "0.11.8"
indexmap = { version = "2.9.0", features = ["serde"] }
bimap = "0.6.3"
bytecount = "0.6.0"
rustc-hash = "2.1.1"
linked_hash_set = "0.1.5"
once_cell = "1.21.3"

[build-dependencies]
lalrpop = { version = "0.22.2", default-features = false }

[dev-dependencies]
test-case = "3.3.1"

[[bin]]
name = "aiplan"
path = "src/bin/aiplan.rs"
