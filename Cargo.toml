[package]
name = "aiplan4rust"
version = "0.1.0"
authors = ["Damien Pellier <damien.pellier@imag.fr>"]
edition = "2021"

[dependencies]
logos = "0.15"
lalrpop-util = "0.22.2"
ordered-float = "5.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.140"
toml = "0.7.8"
serde_cbor = "0.11.2"
rmp-serde = "1.3"
base64 = "0.21"
clap = { version = "4.5.53", features = ["derive"] }
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
colored = "3.0.0"
itertools = "0.14.0"
log = "0.4.27"
env_logger = "0.11.8"
bimap = "0.6.3"
bytecount = "0.6.9"
once_cell = "1.21.3"
walkdir = "2.5.0"
thiserror = "1.0"
chrono = "0.4.41"
ahash = "0.8.12"
clap_builder = "4.5.53"
bit-set = "0.5"
smallvec = "1.15.1 "

[build-dependencies]
lalrpop = { version = "0.22.2", default-features = false }

[dev-dependencies]
test-case = "3.3.1"

[[bin]]
name = "aiplan"
path = "src/bin/aiplan.rs"
