name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo registry and build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose --jobs 2

      - name: Run tests
        shell: bash
        env:
          # Affiche les logs de ton application (si tu utilises env_logger ou tracing)
          RUST_LOG: debug
          # Donne plus de contexte sur les panics Rust
          RUST_BACKTRACE: 1
          # Force l'affichage immédiat des logs sans bufferisation
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          echo "Saving test output to $LOG_FILE"
          
          # Ton filtre actuel
          FILTER="kind(lib) or binary(parser_tests)"
          
          # 1. --nocapture : INDISPENSABLE pour voir tes println! et eprint!
          # 2. --failure-output immediate-all : Affiche les erreurs dès qu'elles surviennent
          # 3. --verbose : Sortie détaillée
          cargo nextest run \
            -E "$FILTER" \
            --test-threads 1 \
            --status-level all \
            --failure-output immediate-all \
            --verbose \
            --nocapture 2>&1 | tee "$LOG_FILE"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
