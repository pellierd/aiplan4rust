name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  # On force l'utilisation de LLD et on retire tout ce qui alourdit le binaire
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C debuginfo=0 -C strip=symbols"
  RUST_LOG: debug
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install LLD Linker
        # LLD consomme beaucoup moins de RAM que le linker par défaut
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (Low Memory Mode)
        shell: bash
        run: |
          set -o pipefail
          
          echo "=== MÉMOIRE DISPONIBLE AU DÉPART ==="
          free -h

          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          FILTER="all() and not binary(parser_tests)"
          
          echo "=== LANCEMENT DE LA COMPILATION ET DES TESTS ==="
          
          # --jobs 1 : Un seul fichier compilé/testé à la fois
          # --status-level pass : Affiche chaque succès en direct dans la console
          # --color always : Pour garder la lisibilité (vert/rouge) dans GitHub
          cargo nextest run \
            --jobs 1 \
            -E "$FILTER" \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always \
            --nocapture \
            --verbose 2>&1 | tee "$LOG_FILE"
          
          echo "=== FIN DU PROCESSUS ==="
          free -h

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
