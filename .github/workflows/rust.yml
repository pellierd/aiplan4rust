name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo registry and build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose --jobs 2

      - name: Run tests
        shell: bash
        run: |
          # set -o pipefail garantit que si nextest échoue, l'étape échoue aussi
          set -o pipefail
          
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          echo "Saving test output to $LOG_FILE"

          # Définition du filtre : Tests unitaires (lib) + Tests d'intégration spécifiques
          FILTER="kind(lib) \
            or binary(parser_tests) \
            or binary(normalizer_tests) \
            or binary(analyser_tests) \
            or binary(linker_tests)"            
          
          # Correction : status-level 'all' pour voir le début de chaque test (STARTING)
          # Utilisation de --test-threads 1 pour isoler précisément le coupable du Exit 143
          cargo nextest run \
            -E "$FILTER" \
            --test-threads 1 \
            --status-level all \
            --verbose 2>&1 | tee "$LOG_FILE"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
