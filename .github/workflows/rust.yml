name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  RUSTFLAGS: "-C debuginfo=0"
  RUST_LOG: debug
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (Trace)
        run: |
          echo "=== DÉBUT DE LA COMPILATION (Mode 1 Job) ==="
          cargo build --verbose --jobs 1
          echo "=== COMPILATION TERMINÉE ==="

      - name: Run tests (Trace)
        shell: bash
        run: |
          set -o pipefail
          
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          echo "Log file created: $LOG_FILE"

          FILTER="all() and not binary(parser_tests)"
          
          echo "=== LANCEMENT DES TESTS AVEC NEXTEST ==="
          echo "Configuration: 1 thread de test, 1 job de compilation."

          # --status-level pass : Affiche chaque test réussi immédiatement
          # --failure-output immediate-all : Affiche les erreurs dès qu'elles arrivent
          cargo nextest run \
            -j 1 \
            -E "$FILTER" \
            --test-threads 1 \
            --status-level pass \
            --failure-output immediate-all \
            --success-output immediate \
            --nocapture \
            --verbose 2>&1 | tee "$LOG_FILE"
          
          echo "=== FIN DES TESTS ==="

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
