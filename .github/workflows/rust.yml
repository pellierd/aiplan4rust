name: Rust CI (Low Memory & Swap)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  # Optimisation agressive pour la RAM : pas de debuginfo, linker LLD et strip des symboles
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C debuginfo=0 -C strip=symbols"
  # On force la compilation sur un seul cœur pour éviter les pics de RAM
  CARGO_BUILD_JOBS: 1
  # Log au niveau info pour ne pas saturer les buffers pendant la compilation
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Maximize Swap Space (10GB)
        # GitHub Actions a environ 14GB de disque libre, on en prend 10 pour le swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MÉMOIRE ET SWAP APRÈS CONFIGURATION ==="
          free -h

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile and Run Tests
        shell: bash
        run: |
          set -o pipefail
          
          # On définit les filtres pour les tests
          FILTER="all() and not binary(parser_tests)"

          echo "=== COMPILATION (NO RUN) ==="
          # On compile d'abord pour isoler les erreurs de linking
          cargo test --no-run --locked

          echo "=== EXÉCUTION DES TESTS (JOBS=1) ==="
          # On change le log en debug juste pour l'exécution pour voir tes traces
          export RUST_LOG="info,aiplan4rust::grounding=debug,aiplan4rust::lir::expr=debug"
          
          cargo nextest run \
            --jobs 1 \
            -E "$FILTER" \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always \
            --nocapture 2>&1 | tee test_results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_results.log
