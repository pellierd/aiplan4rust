name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v4

      # 2. Install Rust version 1.88
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          override: true

      # 3. Cache Cargo registry, git dependencies, and target folder
      - name: Cache Cargo registry and build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 4. Build the project with verbose output
      - name: Build
        run: cargo build --verbose

      # 5. Run tests and save output to a log file named with the current date
      - name: Run tests
        run: |
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          echo "Saving test output to $LOG_FILE"
          cargo test --verbose 2>&1 | tee "$LOG_FILE"
        continue-on-error: true

      # 6. Upload the log file as an artifact
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-log
          path: test-*.log
