name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  RUSTFLAGS: "-C debuginfo=0"
  RUST_LOG: debug
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (Trace)
        run: |
          echo "=== INFO RAM AVANT BUILD ==="
          free -h
          echo "=== DÉBUT DE LA COMPILATION (Jobs=1) ==="
          cargo build --verbose --jobs 1
          echo "=== COMPILATION TERMINÉE ==="

      - name: Run tests (Trace)
        shell: bash
        run: |
          set -o pipefail
          
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          
          echo "=== INFO RAM AVANT TESTS ==="
          free -h

          FILTER="all() and not binary(parser_tests)"
          
          echo "=== LANCEMENT DES TESTS (AFFICHAGE INDIVIDUEL) ==="
          
          # On utilise --status-level pass pour voir chaque test OK
          # On utilise --failure-output immediate pour voir chaque erreur tout de suite
          # On force --color always pour que ce soit lisible dans la console GitHub
          cargo nextest run \
            --jobs 1 \
            -E "$FILTER" \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always \
            --nocapture \
            --verbose 2>&1 | tee "$LOG_FILE"
          
          echo "=== FIN DES TESTS ==="

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
