name: Rust CI 'AIPlan4Rust'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  # Aggressive RAM optimization: use LLD linker, disable debuginfo, and strip symbols
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C debuginfo=0 -C strip=symbols"
  # Single-core compilation to prevent RAM spikes during the build phase
  CARGO_BUILD_JOBS: 1
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Maximize Swap Space (10GB)
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MEMORY STATS ==="
          free -h

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile and Run Tests
        shell: bash
        run: |
          set -o pipefail
          
          # 1. PRE-COMPILATION
          echo "=== COMPILING ALL TARGETS ==="
          # Compiling without --locked to prevent Error 101 on outdated lockfiles
          cargo test --no-run

          # 2. UNIT TESTS (Library)
          #echo "=== RUNNING UNIT TESTS (LIB) ==="
          # Unit tests are usually light; we run them with default concurrency
          #cargo nextest run --lib \
          #  --status-level pass \
          #  --failure-output immediate \
          #  --color always

          # 3. INTEGRATION TESTS (Heavy IPC Benchmarks)
          echo "=== RUNNING INTEGRATION TESTS ==="
          # Selection filter for specific integration modules
          FILTER="test(syntax) or test(normalization) or test(semantic) or test(encoder) or test(linking)"
          
          # Enable detailed debugging for grounding and LIR logic
          export RUST_LOG="info,aiplan4rust::grounding=debug,aiplan4rust::lir::expr=debug"
          
          # Force JOBS=1 to ensure the heavy grounding process doesn't trigger OOM
          cargo nextest run \
            --test integration \
            -E "$FILTER" \
            --jobs 1 \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always 2>&1 | tee test_results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_results_log
          path: test_results.log
