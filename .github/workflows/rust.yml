name: Rust CI (Low Memory & Swap)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  # Optimisation RAM : pas de debuginfo, linker LLD et strip
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C debuginfo=0 -C strip=symbols"
  CARGO_BUILD_JOBS: 1
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Maximize Swap Space (10GB)
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Compile and Run Tests
        shell: bash
        run: |
          # 1. On retire --locked pour éviter l'erreur 101 si le lock est daté
          echo "=== COMPILATION (NO RUN) ==="
          cargo test --no-run

          # 2. Exécution des tests avec filtres
          echo "=== EXÉCUTION DES TESTS (JOBS=1) ==="
          FILTER="all() and not binary(parser_tests)"
          
          # Override du log pour le debug spécifique
          export RUST_LOG="info,aiplan4rust::grounding=debug,aiplan4rust::lir::expr=debug"
          
          cargo nextest run \
            --jobs 1 \
            -E "$FILTER" \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always \
            --nocapture 2>&1 | tee test_results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_results.log
