name: Rust CI (Low Memory & Swap)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  # Optimisation agressive pour la RAM
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C debuginfo=0 -C strip=symbols"
  # Un seul cœur pour la compilation pour éviter les pics de RAM
  CARGO_BUILD_JOBS: 1
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Maximize Swap Space (10GB)
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MÉMOIRE DISPONIBLE ==="
          free -h

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile and Run Tests
        shell: bash
        run: |
          set -o pipefail
          
          # --- CONFIGURATION DU FILTRE ---
          # Modifie cette ligne pour choisir tes tests (ex: "test(syntax) or test(linking)")
          # Pour tout lancer, utilise : FILTER="all()"
          FILTER="test(syntax) or test(semantic) or test(normalization) or test(encoder) or test(linking)"

          echo "=== COMPILATION DU BINAIRE D'INTÉGRATION ==="
          # On compile sans --locked pour éviter l'erreur 101
          cargo test --test integration_tests --no-run

          echo "=== LISTE DES TESTS SÉLECTIONNÉS ==="
          cargo nextest list --test integration_tests -E "$FILTER"

          echo "=== EXÉCUTION (JOBS=1) ==="
          # Logs de debug spécifiques pour tes modules
          export RUST_LOG="info,aiplan4rust::grounding=debug,aiplan4rust::lir::expr=debug"
          
          cargo nextest run \
            --test integration_tests \
            -E "$FILTER" \
            --jobs 1 \
            --status-level pass \
            --failure-output immediate \
            --success-output immediate \
            --color always 2>&1 | tee test_results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_results_log
          path: test_results.log
