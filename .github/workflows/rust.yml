name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: false
  RUSTFLAGS: "-C debuginfo=0"
  RUST_LOG: debug
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose --jobs 2

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          
          LOG_FILE="test-$(date +'%Y-%m-%d_%H-%M-%S').log"
          echo "Saving test output to $LOG_FILE"

          # FILTRE : On prend tout SAUF parser_tests
          FILTER="all() and not binary(parser_tests)"
          
          echo "Lancement de tous les tests sauf parser_tests..."

          # Options optimisées pour le debug sur GitHub Actions
          cargo nextest run \
            -E "$FILTER" \
            --test-threads 1 \
            --status-level all \
            --failure-output immediate \
            --success-output immediate \
            --nocapture \
            --verbose 2>&1 | tee "$LOG_FILE"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-*.log
